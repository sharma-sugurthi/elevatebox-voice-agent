name: CI/CD Pipeline

on:
  push:
    branches:
      - master
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Tests
        env:
          GEMINI_API_KEY: placeholder_key
          EVALUATOR_PHONE: +918688664337
          MY_PHONE: +919392521762
        run: |
          pytest tests/ -v -m "not integration and not live"

  deploy:
    needs: test  # This forces deploy to wait for tests. If tests fail, deploy is cancelled.
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Heroku
        uses: akhileshns/heroku-deploy@v3.13.15
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: "elevatebox-agent"
          heroku_email: ${{ secrets.HEROKU_EMAIL }}
