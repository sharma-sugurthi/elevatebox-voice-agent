name: CI/CD Pipeline

on:
  push:
    branches:
      - master
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Tests
        env:
          GEMINI_API_KEY: placeholder_key
          EVALUATOR_PHONE: "+918688664337"
          MY_PHONE: "+919392521762"
        run: |
          pytest tests/ -v -m "not integration and not live"

  deploy:
    needs: test  # This forces deploy to wait for tests. If tests fail, deploy is cancelled.
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          git remote add heroku https://heroku:${HEROKU_API_KEY}@git.heroku.com/elevatebox-agent.git
          git push heroku HEAD:main -f
